# Publishes the app to GitHub Pages via the gh-pages branch.
# Binary assets are not in git: the workflow fetches them (scripts/fetch-assets.mjs),
# then force-pushes the ready site to gh-pages. Pages source: "Deploy from a branch" → gh-pages / root.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-assets.mjs
      - name: Push site to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          rsync -a --exclude .git --exclude .github --exclude scripts --exclude .gitignore --exclude .gitattributes ./ "$SITE/"
          touch "$SITE/.nojekyll"
          cd "$SITE"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
