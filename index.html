<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Шуточная дуэль двух лиц для интерактивной панели.">
  <title>mog battle</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-cyrillic-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app" data-state="boot">
    <!-- The camera stream plays here; it is shown through #screen (js/view.js) -->
    <video id="video" muted playsinline autoplay disablepictureinpicture></video>
    <canvas id="screen" class="layer"></canvas>
    <!-- Result freeze-frame (js/still.js) -->
    <canvas id="still" class="layer"></canvas>
    <div class="layer scrim"></div>
    <canvas id="overlay" class="layer"></canvas>

    <!-- Invisible: hold 1.5 s to open settings -->
    <div class="hotspot" id="hotspot" aria-hidden="true"></div>
    <div class="series v" id="series"><span data-side="L">0</span><i>:</i><span data-side="R">0</span></div>
    <div class="record v rise" id="record"><span class="record-label">Рекорд дня</span><b>—</b></div>

    <section class="card v rise" data-side="L">
      <div class="card-head"><span class="card-label">Слева<em class="card-streak"></em></span><span class="card-tag">Победа</span></div>
      <div class="card-score"><b>—</b><small>/10</small></div>
      <div class="card-bar"><i></i></div>
    </section>
    <section class="card v rise" data-side="R">
      <div class="card-head"><span class="card-label">Справа<em class="card-streak"></em></span><span class="card-tag">Победа</span></div>
      <div class="card-score"><b>—</b><small>/10</small></div>
      <div class="card-bar"><i></i></div>
    </section>

    <div class="chip v" id="chip">
      <span class="chip-label">Бонус раунда</span><span class="chip-hint"></span><span class="chip-mult"></span>
    </div>
    <div class="countdown" id="countdown"></div>

    <div class="attract v rise" id="attract">
      <h2 class="attract-title">Кто кого?</h2>
      <p class="attract-sub">Встаньте вдвоём в овалы</p>
    </div>

    <footer class="bottom">
      <p class="notice v rise" id="notice"></p>
      <div class="slot">
        <button class="btn primary v rise" id="btn-start" type="button">Старт</button>
        <div class="scanbar v" id="scanbar">
          <div class="tug" id="tug"><div class="tug-track"><i class="tug-l"></i><i class="tug-r"></i></div><div class="tug-knob"></div></div>
          <div class="progress" id="progress"><i></i></div>
        </div>
        <div class="pair v rise" id="result-actions">
          <button class="btn primary" id="btn-rematch" type="button">Реванш</button>
          <button class="btn secondary" id="btn-new" type="button">Новые игроки</button>
        </div>
      </div>
    </footer>

    <div class="screen v" id="screen">
      <h1 class="screen-title"></h1>
      <p class="screen-body"></p>
      <div class="screen-actions">
        <button class="btn primary" id="btn-retry" type="button">Повторить</button>
        <button class="btn secondary" id="btn-screen-settings" type="button">Настройки</button>
      </div>
    </div>

    <div class="sheet v" id="settings" aria-hidden="true"></div>
    <div class="fps v" id="fps"></div>
  </div>
  <noscript>Нужен JavaScript.</noscript>
</body>
</html>
